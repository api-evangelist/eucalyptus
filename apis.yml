name: Eucalyptus
description: 'Eucalyptus (eucalyptus.health) is a global digital healthcare company founded in 2019 and
  headquartered in Sydney, Australia, that builds and operates patient-first telehealth clinics. It runs
  four consumer digital-health brands — Juniper (women''s weight management and menopause), Pilot (men''s
  health, hair loss, sexual health and weight), Software (clinical-grade skincare and dermatology) and
  Kin (reproductive, fertility and postpartum care) — across Australia, the United Kingdom, Germany, Japan
  and Canada, pairing licensed practitioners with technology and connected-care tooling. Eucalyptus was
  acquired by Hims & Hers Health in June 2026. This profile is a consumer-facing healthtech company: it
  publishes no public developer API, developer portal, or OpenAPI at this time, so enrichment is limited
  to verified corporate identity, published website properties, a responsible-disclosure program, and
  probed domain-security posture.'
